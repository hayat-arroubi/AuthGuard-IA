<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>404 — Page introuvable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Space Grotesk',sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f1f5f9; }
    .error-code { font-size:6rem;font-weight:700;color:#1d4ed8;line-height:1; }
    .btn-home { background:#1d4ed8;border:none;color:#fff;padding:.75rem 2rem;border-radius:.625rem;font-weight:600;text-decoration:none;display:inline-block;margin-top:1.5rem; }
    .btn-home:hover { background:#1e40af;color:#fff; }
  </style>
</head>
<body>
<div class="text-center">
  <div class="error-code">404</div>
  <h2 style="font-weight:700;margin:.5rem 0">Page introuvable</h2>
  <p style="color:#64748b">La page que vous cherchez n'existe pas ou a été déplacée.</p>
  <a href="{{ url_for('auth.login') }}" class="btn-home"><i class="bi bi-house me-2"></i>Retour à l'accueil</a>
</div>
</body>
</html>
